<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planner</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --success: #27ae60;
      --warn: #e67e22;
      --danger: #e74c3c;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2c3e50;
      --muted: #95a5a6;
      --border: #dfe6e9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
    }

    #date-display {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .section {
      background: var(--card);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }

    .section h2 .icon { font-size: 1.3rem; }

    /* Top Priorities */
    .priorities-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .priority-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .priority-item .rank {
      background: var(--accent);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .priority-item input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    /* Schedule */
    .schedule-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 6px 12px;
      align-items: center;
    }

    .schedule-grid .time-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: right;
      font-weight: 600;
    }

    .schedule-grid input[type="text"] {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Tasks */
    .task-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .task-input-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .task-input-row button, .btn {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn:hover { opacity: 0.9; }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--bg);
    }

    .task-list li.done {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .task-list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-list li .task-text { flex: 1; }

    .task-list li .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
    }

    /* Notes */
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .btn-outline {
      padding: 10px 20px;
      background: var(--card);
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-outline:hover { background: var(--accent); color: #fff; }

    .btn-danger {
      background: var(--card);
      color: var(--danger);
      border: 2px solid var(--danger);
    }

    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-success {
      background: var(--card);
      color: var(--success);
      border: 2px solid var(--success);
    }

    .btn-success:hover { background: var(--success); color: #fff; }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(52,152,219,0.15);
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .schedule-grid { grid-template-columns: 70px 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Daily Planner</h1>
      <div id="date-display"></div>
    </header>

    <!-- Top 3 Priorities -->
    <div class="section">
      <h2><span class="icon">*</span> Top 3 Priorities</h2>
      <div class="priorities-list">
        <div class="priority-item">
          <span class="rank">1</span>
          <input type="text" id="priority-1" placeholder="Most important task today..." data-save="priority-1">
        </div>
        <div class="priority-item">
          <span class="rank">2</span>
          <input type="text" id="priority-2" placeholder="Second priority..." data-save="priority-2">
        </div>
        <div class="priority-item">
          <span class="rank">3</span>
          <input type="text" id="priority-3" placeholder="Third priority..." data-save="priority-3">
        </div>
      </div>
    </div>

    <!-- Time-Blocked Schedule -->
    <div class="section">
      <h2><span class="icon">~</span> Schedule</h2>
      <div class="schedule-grid" id="schedule-grid">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Task List -->
    <div class="section">
      <h2><span class="icon">+</span> Tasks</h2>
      <div class="task-input-row">
        <input type="text" id="new-task" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn" onclick="addTask()">Add</button>
      </div>
      <ul class="task-list" id="task-list"></ul>
    </div>

    <!-- Notes -->
    <div class="section">
      <h2><span class="icon">#</span> Notes</h2>
      <textarea id="notes" placeholder="Meeting notes, ideas, reminders..." data-save="notes"></textarea>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-outline btn-success" onclick="saveDay()">Save Today</button>
      <button class="btn-outline" onclick="loadDay()">Load Saved Day</button>
      <button class="btn-outline btn-danger" onclick="clearAll()">Clear All</button>
      <button class="btn-outline" onclick="printDay()">Print</button>
    </div>
  </div>

  <script>
    // --- Date display ---
    const today = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date-display').textContent = today.toLocaleDateString('en-US', options);

    const dateKey = today.toISOString().slice(0, 10);

    // --- Schedule generation ---
    const scheduleGrid = document.getElementById('schedule-grid');
    const hours = [];
    for (let h = 6; h <= 21; h++) {
      const ampm = h < 12 ? 'AM' : 'PM';
      const display = h <= 12 ? h : h - 12;
      hours.push({ label: `${display}:00 ${ampm}`, key: `sched-${h}` });
    }

    hours.forEach(({ label, key }) => {
      const timeLabel = document.createElement('span');
      timeLabel.className = 'time-label';
      timeLabel.textContent = label;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '';
      input.dataset.save = key;

      scheduleGrid.appendChild(timeLabel);
      scheduleGrid.appendChild(input);
    });

    // --- Tasks ---
    let tasks = [];

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.done;
        cb.onchange = () => { tasks[i].done = cb.checked; renderTasks(); autoSave(); };

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = 'x';
        del.onclick = () => { tasks.splice(i, 1); renderTasks(); autoSave(); };

        li.append(cb, span, del);
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('new-task');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      renderTasks();
      autoSave();
    }

    // --- Persistence (localStorage) ---
    function gatherData() {
      const data = { tasks };
      document.querySelectorAll('[data-save]').forEach(el => {
        data[el.dataset.save] = el.value;
      });
      return data;
    }

    function applyData(data) {
      if (!data) return;
      tasks = data.tasks || [];
      renderTasks();
      document.querySelectorAll('[data-save]').forEach(el => {
        if (data[el.dataset.save] !== undefined) {
          el.value = data[el.dataset.save];
        }
      });
    }

    function autoSave() {
      localStorage.setItem(`planner-${dateKey}`, JSON.stringify(gatherData()));
    }

    function saveDay() {
      autoSave();
      alert('Saved for ' + dateKey);
    }

    function loadDay() {
      const key = prompt('Load date (YYYY-MM-DD):', dateKey);
      if (!key) return;
      const data = localStorage.getItem(`planner-${key}`);
      if (data) {
        applyData(JSON.parse(data));
        alert('Loaded plan for ' + key);
      } else {
        alert('No saved plan found for ' + key);
      }
    }

    function clearAll() {
      if (!confirm('Clear everything for today?')) return;
      document.querySelectorAll('[data-save]').forEach(el => { el.value = ''; });
      tasks = [];
      renderTasks();
      autoSave();
    }

    function printDay() {
      window.print();
    }

    // Auto-save on input changes
    document.addEventListener('input', (e) => {
      if (e.target.dataset.save) autoSave();
    });

    // Load today on start
    const saved = localStorage.getItem(`planner-${dateKey}`);
    if (saved) applyData(JSON.parse(saved));
  </script>
</body>
</html>
